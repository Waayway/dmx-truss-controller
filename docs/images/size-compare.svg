<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1280"><rect width="1750" height="1280" fill="#fff"/><text x="40" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" fill="#111" font-weight="700" text-anchor="start">How big is the base, compared with the knob?</text><polygon points="884.0,428.5 641.5,186.0 298.5,186.0 56.0,428.5 56.0,771.5 298.5,1014.0 641.5,1014.0 884.0,771.5" fill="#e8edf5" stroke="#2563eb" stroke-width="4"/><polygon points="810.4,459.0 611.0,259.6 329.0,259.6 129.6,459.0 129.6,741.0 329.0,940.4 611.0,940.4 810.4,741.0" fill="#eaf5ea" stroke="#16a34a" stroke-width="4"/><polygon points="792.0,466.6 603.4,278.0 336.6,278.0 148.0,466.6 148.0,733.4 336.6,922.0 603.4,922.0 792.0,733.4" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="14 8"/><polygon points="769.0,476.2 593.8,301.0 346.2,301.0 171.0,476.2 171.0,723.8 346.2,899.0 593.8,899.0 769.0,723.8" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="6 8"/><polygon points="734.5,490.4 579.6,335.5 360.4,335.5 205.5,490.4 205.5,709.6 360.4,864.5 579.6,864.5 734.5,709.6" fill="#fdf1e3" stroke="#dc2626" stroke-width="4"/><circle cx="470" cy="600" r="133.4" fill="#3a3e44" stroke="#111" stroke-width="3"/><circle cx="470" cy="600" r="98.9" fill="#17191c"/><circle cx="470" cy="600" r="88.5" fill="#2b6cb0"/><circle cx="470" cy="600" r="73.6" fill="none" stroke="#e0a030" stroke-width="3" stroke-dasharray="8 6"/><text x="470" y="606" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">KNOB</text><text x="470" y="628" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#fff" font-weight="400" text-anchor="middle">58 mm</text><line x1="355" y1="1060" x2="585" y2="1060" stroke="#111" stroke-width="5"/><text x="470" y="1094" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#111" font-weight="400" text-anchor="middle">50 mm</text><rect x="960" y="160" width="36" height="36" fill="#2563eb"/><text x="1012" y="188" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#111" font-weight="700" text-anchor="start">180 mm  (now)</text><text x="1012" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#111" font-weight="400" text-anchor="start">USB-C cable turns 90 degrees</text><text x="1012" y="252" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#555" font-weight="400" text-anchor="start">Easiest on the cable. 195 mm corner to corner.</text><rect x="960" y="310" width="36" height="36" fill="#16a34a"/><text x="1012" y="338" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#111" font-weight="700" text-anchor="start">148 mm</text><text x="1012" y="372" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#111" font-weight="400" text-anchor="start">cable turns 135 degrees</text><text x="1012" y="402" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#555" font-weight="400" text-anchor="start">Smallest base that still avoids the full wrap-around.</text><rect x="960" y="460" width="36" height="36" fill="#d97706"/><text x="1012" y="488" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#111" font-weight="700" text-anchor="start">140 mm  (dashed)</text><text x="1012" y="522" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#111" font-weight="400" text-anchor="start">cable turns about 165 to 180 degrees</text><text x="1012" y="552" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#555" font-weight="400" text-anchor="start">Close to the old wrap-around. 90 degrees does NOT fit.</text><rect x="960" y="610" width="36" height="36" fill="#9ca3af"/><text x="1012" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#111" font-weight="700" text-anchor="start">130 mm  (dashed)</text><text x="1012" y="672" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#111" font-weight="400" text-anchor="start">wrap-around (180 degrees) only</text><text x="1012" y="702" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#555" font-weight="400" text-anchor="start">90 degrees does NOT fit.</text><rect x="960" y="760" width="36" height="36" fill="#dc2626"/><text x="1012" y="788" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#111" font-weight="700" text-anchor="start">115 mm  (first design)</text><text x="1012" y="822" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#111" font-weight="400" text-anchor="start">full wrap-around, 180 degrees</text><text x="1012" y="852" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#555" font-weight="400" text-anchor="start">About 1 mm of spare cable. Most stress on the cable.</text><text x="40" y="1220" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#444" font-weight="400" text-anchor="start">Why not smaller with a 90 degree bend: the Neutrik cable has a 54 mm stiff end and a 37 mm stiff plug end that cannot bend.</text><text x="40" y="1250" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#444" font-weight="400" text-anchor="start">Together with the Nano (43 mm) they form an L about 85 mm long, and the octagon corners cut it off. Cable sizes are +-3 mm (photos).</text></svg>