<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760"><rect width="1500" height="760" fill="#fff"/><text x="750" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" fill="#111" font-weight="700" text-anchor="middle">The Neutrik USB-C cable: why there is almost no spare length</text><text x="80" y="120" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#111" font-weight="700" text-anchor="start">1. The cable you bought (end to end, to scale)</text><rect x="80" y="140" width="432" height="70" fill="#6b7280" stroke="#222" stroke-width="3"/><text x="296" y="172" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">54 mm STIFF</text><text x="296" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#fff" font-weight="400" text-anchor="middle">jack body + strain relief</text><rect x="512" y="140" width="600" height="70" fill="#111" stroke="#222" stroke-width="3"/><text x="812" y="172" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">75 mm FLEXIBLE</text><text x="812" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#fff" font-weight="400" text-anchor="middle">the only part that can bend</text><rect x="1112" y="140" width="296" height="70" fill="#6b7280" stroke="#222" stroke-width="3"/><text x="1260" y="172" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">37 mm STIFF</text><text x="1260" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#fff" font-weight="400" text-anchor="middle">plug end</text><text x="80" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#444" font-weight="400" text-anchor="start">Sizes read from your photos (about plus or minus 3 mm). Only the black part can be bent.</text><text x="80" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#111" font-weight="700" text-anchor="start">2. What the black part has to do inside the base</text><rect x="80" y="340" width="289.9232" height="70" fill="#2563eb" stroke="#222" stroke-width="3"/><text x="224.9616" y="372" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">36 mm</text><text x="224.9616" y="398" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#fff" font-weight="400" text-anchor="middle">straight up</text><rect x="369.9232" y="340" width="301.59289474462014" height="70" fill="#d97706" stroke="#222" stroke-width="3"/><text x="520.7196473723101" y="372" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle">38 mm</text><text x="520.7196473723101" y="398" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#fff" font-weight="400" text-anchor="middle">U-turn (radius 12)</text><rect x="671.5160947446202" y="340" width="8.483905255379852" height="70" fill="#16a34a" stroke="#222" stroke-width="3"/><text x="675.7580473723101" y="372" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#fff" font-weight="700" text-anchor="middle"></text><text x="675.7580473723101" y="398" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#fff" font-weight="400" text-anchor="middle"></text><text x="694" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#15803d" font-weight="700" text-anchor="start">1.1 mm spare</text><text x="694" y="398" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#15803d" font-weight="400" text-anchor="start">(this is the slack)</text><text x="80" y="450" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#444" font-weight="400" text-anchor="start">36.2 + 37.7 + 1.1 = 75 mm. The U-turn cannot be tighter than radius 12: the cable ripples.</text><text x="80" y="530" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#111" font-weight="700" text-anchor="start">3. Why it matters</text><text x="80" y="570" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#111" font-weight="400" text-anchor="start">- Only 1 mm spare, and the sizes are +-3 mm: the plug may not reach the Nano, or it will be forced into a tighter bend.</text><text x="80" y="605" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#111" font-weight="400" text-anchor="start">- The stiff ends cannot bend, so a bigger base helps little (120 mm: about 3 mm spare, 125 mm: about 4 mm).</text><text x="80" y="640" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#111" font-weight="400" text-anchor="start">- Check: lay the real jack and cable in a 115 mm circle on paper and see if the plug reaches the Nano port.</text><text x="80" y="690" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#111" font-weight="700" text-anchor="start">Fixes: a bigger base (125 mm), a shorter USB-C extension cable instead of the Neutrik, or plug straight into the Nano.</text></svg>